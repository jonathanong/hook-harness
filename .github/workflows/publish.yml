name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; pnpm publish delegates to the npm on PATH.
      - run: npm install -g npm@12.2.2
      - name: Release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match packages/cli version v$version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm publish --filter hook-harness --no-git-checks
