name: Publish

# Run by hand to release: bump the CLI version (and the plugin manifests), commit and tag it on
# main, publish to npm, then create the GitHub release. The file name is the npm trusted
# publisher's, so keep it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: release to npm
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write # release commit, tag and GitHub release
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1. pnpm publish can't attach provenance here, so npm publishes.
      - run: npm install -g npm@12.2.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump versions, commit, tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          (cd packages/cli && npm version "$BUMP" --no-git-tag-version)
          version="$(node -p "require('./packages/cli/package.json').version")"
          manifests=".claude-plugin/plugin.json plugins/hook-harness/.claude-plugin/plugin.json plugins/hook-harness/.codex-plugin/plugin.json"
          node .github/scripts/sync-plugin-version.mjs
          # shellcheck disable=SC2086 # split the list on purpose
          pnpm exec oxfmt $manifests
          # shellcheck disable=SC2086
          git add packages/cli/package.json $manifests
          git commit -m "chore(release): v$version"
          git tag -a "v$version" -m "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Built after the bump so the bundle reports the new version.
      - run: pnpm build
      - run: git push origin HEAD:main --follow-tags
      # dist/ is fully bundled and there are no runtime dependencies, so npm can publish it as is.
      - run: npm publish
        working-directory: packages/cli
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
