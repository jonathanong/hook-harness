name: Publish

# A merged version bump in packages/cli/package.json is the release: publish to npm, then tag and
# create the GitHub release. Re-running is safe; steps already done are skipped.
on:
  push:
    branches: [main]
    paths: [packages/cli/package.json]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write # tag and GitHub release
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1. pnpm publish can't attach provenance here, so npm publishes.
      - run: npm install -g npm@12.2.2
      - name: What is left to do
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "hook-harness@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.published != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.state.outputs.published != 'true'
        run: pnpm check
      - if: steps.state.outputs.published != 'true'
        run: pnpm build
      # dist/ is fully bundled and there are no runtime dependencies, so npm can publish it as is.
      - if: steps.state.outputs.published != 'true'
        run: npm publish
        working-directory: packages/cli
      - if: steps.state.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
